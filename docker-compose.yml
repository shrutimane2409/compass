# Dev:   docker compose up -d db            (run API, AI and web locally)
# Full:  docker compose --profile app up -d --build   → http://localhost:3000
# Seed:  docker compose --profile seed run --rm seed
services:
  db:
    image: pgvector/pgvector:pg16
    container_name: compass-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-compass}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-compass_dev}
      POSTGRES_DB: ${POSTGRES_DB:-compass}
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-compass}"]
      interval: 5s
      retries: 10

  ai:
    profiles: ["app"]
    build: ./ai
    env_file:
      - path: ./ai/.env
        required: false
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-compass}:${POSTGRES_PASSWORD:-compass_dev}@db:5432/${POSTGRES_DB:-compass}
      COMPASS_API_URL: http://api:8080
    depends_on:
      db: { condition: service_healthy }

  api:
    profiles: ["app"]
    build: ./api
    environment:
      ConnectionStrings__Compass: Host=db;Port=5432;Database=${POSTGRES_DB:-compass};Username=${POSTGRES_USER:-compass};Password=${POSTGRES_PASSWORD:-compass_dev}
      AiService__BaseUrl: http://ai:8000
      ForwardedHeaders__Enabled: "true"
    depends_on:
      db: { condition: service_healthy }

  web:
    profiles: ["app"]
    build: ./web
    ports:
      - "${WEB_PORT:-3000}:80"
    depends_on: [api]

  seed:
    profiles: ["seed"]
    build: ./ai
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-compass}:${POSTGRES_PASSWORD:-compass_dev}@db:5432/${POSTGRES_DB:-compass}
    volumes:
      - ./data:/data:ro
    command: sh -c "python -m scripts.load_courses /data/courses.csv && python -m scripts.load_costs /data/living_costs.csv /data/one_off_costs.csv && python -m scripts.ingest /data/sources.txt"
    depends_on:
      db: { condition: service_healthy }

volumes:
  pgdata:
