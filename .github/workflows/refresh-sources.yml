name: Refresh official sources

on:
  schedule:
    - cron: "17 4 * * 1"   # Mondays 04:17 UTC
  workflow_dispatch:

jobs:
  ingest:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: ai } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - name: Ingest changed pages and list courses to re-verify
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m scripts.ingest ../data/sources.txt | tee ingest.log
      - uses: actions/upload-artifact@v4
        with: { name: ingest-log, path: ai/ingest.log }
