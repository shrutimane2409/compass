name: Uptime

# Pings the production API so a failure emails the repo owner (GitHub notifies on failed scheduled runs),
# and keeps the free Render instance warm during the hours students actually use it.
# Budget: every 10 min, 08:00-22:00 UTC is ~14 h/day, ~430 of Render's 750 free hours/month.
on:
  schedule:
    - cron: "*/10 8-21 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: API ready (database reachable)
        run: |
          curl --fail --silent --show-error --retry 3 --retry-delay 20 --retry-all-errors --max-time 90 \
            -o /dev/null -w "ready %{http_code} in %{time_total}s\n" \
            https://compass-api-38m9.onrender.com/health/ready
